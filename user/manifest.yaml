apiVersion: v1
kind: ConfigMap
metadata:
  name: user
  namespace: prints
data:
  MONGO: "true"
  REDIS_URL: "redis://redis:6379"
  MONGO_URL: "mongodb://mongodb:27017/user"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: prints
  # these are replica set labels
  labels:
    project: prints
    component: user
    tier: backend
spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
      project: prints
      component: user
      tier: backend
  # pod definition
  template:
    metadata:
      labels:
        project: prints
        component: user
        tier: backend
    spec:
      containers:
      - name: user
        image: peruripramod/user:v2
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
             name: user
        ports:
        - name: liveness-port
          containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: prints
spec:
  selector:
    project: prints
    component: user
    tier: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user
  namespace: prints
  labels:
    project: prints
    component: user
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 5
