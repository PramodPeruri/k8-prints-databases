apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend
  namespace: prints
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;

    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        sendfile on;
        keepalive_timeout 65;

        server {
            listen 8080;
            server_name localhost;

            root /usr/share/nginx/html;

            location /api/catalogue/ {
                proxy_pass http://catalogue:8080/;
            }

            location /api/user/ {
                proxy_pass http://user:8080/;
            }

            location /api/cart/ {
                proxy_pass http://cart:8080/;
            }

            location /api/shipping/ {
                proxy_pass http://shipping:8080/;
            }

            location /api/payment/ {
                proxy_pass http://payment:8080/;
            }

            location / {
                try_files $uri $uri/ /index.html;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: prints
  # these are replica set labels
  labels:
    project: prints
    component: frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
      project: prints
      component: frontend
      tier: frontend
  # pod definition
  template:
    metadata:
      labels:
        project: prints
        component: frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: peruripramod/frontend:v2
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
             name: frontend
        ports:
        - name: liveness-port
          containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
        volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
       - name: nginx-config
         configMap:
         name: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: prints
spec:
  type: LoadBalancer
  selector:
    project: prints
    component: frontend
    tier: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: prints
  labels:
    project: prints
    component: frontend
    tier: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 5
