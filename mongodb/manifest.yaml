apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: prints
spec:
  selector:
    project: prints
    component: mongodb
    tier: db
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: prints
spec:
  clusterIP: None
  selector:
    project: prints
    component: mongodb
    tier: db
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: prints
spec:
  selector:
    matchLabels:
      project: prints
      component: mongodb
      tier: db # has to match .spec.template.metadata.labels
  serviceName: "mongodb-headless" # this should be head less service name
  replicas: 2 # by default is 1
  template:
    metadata:
      labels:
        project: prints
        component: mongodb
        ier: db # has to match .spec.selector.matchLabels
    spec:
      containers:
      - name: mongodb
        image: peruripramod/mongodb:v2
        volumeMounts:
        - name: mongodb
          mountPath: /data/db
  # This is PVC
  volumeClaimTemplates:
  - metadata:
      name: mongodb
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "prints-ebs"
      resources:
        requests:
          storage: 1Gi